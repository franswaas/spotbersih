name: Deploy SpotBersih to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript Check
        working-directory: app
        run: npm run typecheck

      - name: Build & Export Web Bundle
        working-directory: app
        env:
          EXPO_PUBLIC_AI_SERVER_URL: ${{ secrets.EXPO_PUBLIC_AI_SERVER_URL }}
        run: npx expo export --platform web

      - name: Make Asset Paths Relative
        working-directory: app
        run: |
          sed -i 's|src="/_expo|src="./_expo|g' dist/index.html
          sed -i 's|href="/favicon|href="./favicon|g' dist/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
